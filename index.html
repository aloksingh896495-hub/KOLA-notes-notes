<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOLA BRO | Premium Education Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #00ff88;
            --secondary: #00ffee;
            --accent: #7b61ff;
            --glow: rgba(0, 255, 136, 0.18);
            --glow2: rgba(123, 97, 255, 0.13);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #050505;
            color: #e0ffe0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── 3D CANVAS BACKGROUND ─── */
        #three-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ─── NOISE OVERLAY ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 180px 180px;
            opacity: 0.6;
        }

        /* ─── AMBIENT GRADIENT ORBS ─── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            pointer-events: none;
            z-index: 1;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 520px; height: 520px;
            top: -120px; left: -120px;
            background: radial-gradient(circle, rgba(0,255,136,0.10) 0%, transparent 70%);
            animation-duration: 14s;
        }
        .orb-2 {
            width: 420px; height: 420px;
            top: 40%; right: -100px;
            background: radial-gradient(circle, rgba(0,210,255,0.09) 0%, transparent 70%);
            animation-duration: 18s;
            animation-delay: -5s;
        }
        .orb-3 {
            width: 340px; height: 340px;
            bottom: -80px; left: 35%;
            background: radial-gradient(circle, rgba(123,97,255,0.09) 0%, transparent 70%);
            animation-duration: 20s;
            animation-delay: -9s;
        }
        @keyframes orbFloat {
            0%   { transform: translate(0px, 0px) scale(1); }
            50%  { transform: translate(30px, 20px) scale(1.06); }
            100% { transform: translate(-15px, 35px) scale(0.96); }
        }

        /* ─── SCANLINE ─── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(0,0,0,0.04) 3px,
                rgba(0,0,0,0.04) 4px
            );
        }

        /* ─── CONTENT WRAPPER (above canvas) ─── */
        header, .container, footer, #pdf-viewer-overlay {
            position: relative;
            z-index: 10;
        }

        /* ─── GLASS UI ─── */
        .glass-ui {
            background: rgba(255,255,255,0.025);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 28px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.07);
            transition: box-shadow 0.3s;
        }
        .glass-ui:hover {
            box-shadow: 0 12px 60px rgba(0,255,136,0.07), inset 0 1px 0 rgba(255,255,255,0.10);
        }

        /* ─── PREMIUM TEXT ─── */
        .premium-text {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 60%, #a8ff78 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ─── BUTTONS ─── */
        .btn-action {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000;
            font-weight: 800;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-action::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-action:hover::before { opacity: 1; }
        .btn-action:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 36px rgba(0,255,136,0.30), 0 0 0 1px rgba(0,255,136,0.18);
        }
        .btn-action:active { transform: translateY(0) scale(0.98); }

        .btn-blue {
            background: linear-gradient(135deg, #0066ff, #00d2ff);
            color: white;
            font-weight: 800;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .btn-blue::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-blue:hover::before { opacity: 1; }
        .btn-blue:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 32px rgba(0,102,255,0.28);
        }

        /* ─── CARD HOVER ─── */
        .card-hover {
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), border-color 0.3s, background 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .card-hover:hover {
            border-color: var(--primary);
            background: rgba(0,255,136,0.055);
            transform: scale(1.045) translateY(-3px);
            box-shadow: 0 16px 44px rgba(0,255,136,0.12), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .card-hover:active {
            transform: scale(0.97);
        }

        /* ─── VIEWS ─── */
        .view-step { display: none; animation: fadeInUp 0.55s cubic-bezier(0.22,1,0.36,1) forwards; }
        .view-active { display: block; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(22px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ─── PDF OVERLAY ─── */
        #pdf-viewer-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            z-index: 100;
            flex-direction: column;
        }

        /* ─── GALLERY ─── */
        .gallery-img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), border-color 0.3s, box-shadow 0.3s;
        }
        .gallery-img:hover {
            transform: scale(1.06) rotate(-1deg);
            border-color: var(--primary);
            box-shadow: 0 16px 48px rgba(0,255,136,0.16);
        }

        /* ─── LOGO ─── */
        .brand-logo-container { display: flex; align-items: center; gap: 15px; }
        .header-logo-image {
            height: 50px; width: 50px;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 50%;
            border: 1.5px solid var(--primary);
            box-shadow: 0 0 18px rgba(0,255,136,0.28), 0 0 0 4px rgba(0,255,136,0.07);
            transition: box-shadow 0.3s, transform 0.3s;
        }
        .header-logo-image:hover {
            box-shadow: 0 0 36px rgba(0,255,136,0.44);
            transform: scale(1.08) rotate(3deg);
        }

        /* ─── HEADER ─── */
        header {
            background: rgba(5,5,5,0.72);
            backdrop-filter: blur(28px) saturate(1.4);
            -webkit-backdrop-filter: blur(28px) saturate(1.4);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        /* ─── INPUT FOCUS GLOW ─── */
        input:focus, select:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(0,255,136,0.13);
            outline: none !important;
        }

        /* ─── STATUS BADGE PULSE ─── */
        #statusBadge {
            animation: badgePulse 2.5s ease-in-out infinite;
        }
        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.22); }
            50%       { box-shadow: 0 0 0 7px rgba(0,255,136,0.00); }
        }

        /* ─── FLOATING PARTICLES (CSS) ─── */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            animation: particleDrift linear infinite;
            opacity: 0;
        }
        @keyframes particleDrift {
            0%   { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.5; }
            100% { transform: translateY(-10vh) translateX(var(--drift)) scale(1.5); opacity: 0; }
        }

        /* ─── 3D TILT CARDS ─── */
        .tilt-card {
            transform-style: preserve-3d;
            perspective: 800px;
            transition: transform 0.1s ease-out;
        }
        .tilt-card-inner {
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }
        .tilt-shine {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.12) 0%, transparent 65%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 2;
        }
        .tilt-card:hover .tilt-shine { opacity: 1; }

        /* ─── ICON GLOW ─── */
        .icon-glow {
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
        }
        .card-hover:hover .icon-glow {
            transform: scale(1.18) translateZ(20px);
            box-shadow: 0 0 24px rgba(0,255,136,0.30);
        }

        /* ─── CHAPTER ROW ─── */
        .chapter-row {
            position: relative;
            overflow: hidden;
        }
        .chapter-row::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 3px;
            transform: scaleY(0);
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
            transform-origin: bottom;
        }
        .chapter-row:hover::before { transform: scaleY(1); }

        /* ─── SCROLL REVEAL ─── */
        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1), transform 0.65s cubic-bezier(0.22,1,0.36,1);
        }
        .reveal.visible {
            opacity: 1;
            transform: none;
        }

        /* ─── ADMIN TABLE ─── */
        tbody tr {
            transition: background 0.2s;
        }
        tbody tr:hover { background: rgba(0,255,136,0.03); }

        /* ─── HOLOGRAPHIC BORDER (auth card) ─── */
        #step-auth {
            position: relative;
        }
        #step-auth::before {
            content: '';
            position: absolute;
            inset: -1.5px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(0,255,136,0.25), rgba(0,210,255,0.18), rgba(123,97,255,0.15), rgba(0,255,136,0.25));
            background-size: 300% 300%;
            animation: holoBorder 5s linear infinite;
            z-index: -1;
        }
        @keyframes holoBorder {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ─── LOADING SPINNER FOR PDF ─── */
        .pdf-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(0,255,136,0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── HEADER TITLE SHINE ─── */
        .brand-title-shine {
            position: relative;
        }
        .brand-title-shine::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
            background-size: 200% 100%;
            animation: titleShine 4s ease-in-out infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        @keyframes titleShine {
            0%, 100% { background-position: -200% center; }
            50%       { background-position: 200% center; }
        }

        /* ─── FOOTER ─── */
        footer { position: relative; z-index: 10; }

        /* ─── ABOUT SECTION ICONS ─── */
        .about-icon {
            display: inline-block;
            animation: iconBounce 2s ease-in-out infinite;
        }
        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-6px); }
        }

        /* ─── GRID STAGGER ─── */
        #subjectList .glass-ui:nth-child(1) { animation-delay: 0.04s; }
        #subjectList .glass-ui:nth-child(2) { animation-delay: 0.09s; }
        #subjectList .glass-ui:nth-child(3) { animation-delay: 0.14s; }
        #subjectList .glass-ui:nth-child(4) { animation-delay: 0.19s; }
        #subjectList .glass-ui:nth-child(5) { animation-delay: 0.24s; }
        #subjectList .glass-ui:nth-child(6) { animation-delay: 0.29s; }
        #subjectList .glass-ui:nth-child(7) { animation-delay: 0.34s; }
        #subjectList .glass-ui:nth-child(8) { animation-delay: 0.39s; }
        #subjectList .glass-ui:nth-child(9) { animation-delay: 0.44s; }
        #subjectList .glass-ui:nth-child(10){ animation-delay: 0.49s; }

        /* ─── 3D FLOATING SHAPES (hero decoration) ─── */
        .shape-3d {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            opacity: 0.13;
            animation: shape3dFloat 18s ease-in-out infinite;
        }
        .shape-3d:nth-child(2) { animation-duration: 23s; animation-delay: -7s; }
        .shape-3d:nth-child(3) { animation-duration: 16s; animation-delay: -3s; }
        @keyframes shape3dFloat {
            0%, 100% { transform: translateY(0) rotateY(0deg) rotateX(0deg); }
            33%       { transform: translateY(-30px) rotateY(120deg) rotateX(20deg); }
            66%       { transform: translateY(15px) rotateY(240deg) rotateX(-15deg); }
        }

        /* ─── GRID LINE BG ─── */
        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
        }

        /* ─── RIPPLE EFFECT ─── */
        .ripple-container { position: relative; overflow: hidden; }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 255, 136, 0.22);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ─── CURSOR GLOW ─── */
        #cursor-glow {
            position: fixed;
            width: 320px; height: 320px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(circle, rgba(0,255,136,0.055) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            transition: transform 0.08s linear, opacity 0.3s;
            opacity: 0;
        }

        /* ─── CHAPTER NUMBER BADGE ─── */
        .ch-badge {
            background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(0,210,255,0.1));
            border: 1px solid rgba(0,255,136,0.2);
            transition: background 0.3s, transform 0.3s;
        }
        .card-hover:hover .ch-badge {
            background: linear-gradient(135deg, rgba(0,255,136,0.30), rgba(0,210,255,0.20));
            transform: scale(1.12) rotate(-3deg);
        }

        /* ─── TYPEWRITER CURSOR ─── */
        .type-cursor::after {
            content: '|';
            animation: blink 1s step-end infinite;
            color: var(--primary);
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }
    </style>
</head>
<body>

<!-- 3D Canvas -->
<canvas id="three-canvas"></canvas>

<!-- Grid BG -->
<div class="grid-bg"></div>

<!-- Ambient Orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Cursor Glow -->
<div id="cursor-glow"></div>

<!-- PDF Viewer Overlay -->
<div id="pdf-viewer-overlay" style="display:none; flex-direction:column;">
    <div class="p-4 bg-black/90 border-b border-white/10 flex justify-between items-center backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="closePDF()" class="text-white bg-white/10 hover:bg-red-500/20 hover:text-red-500 w-10 h-10 rounded-full transition-all flex items-center justify-center">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="flex flex-col">
                <h3 id="pdfTitle" class="text-sm font-bold text-white uppercase tracking-widest leading-none mb-1">Document Viewer</h3>
                <span class="text-[9px] text-[#00ff88] font-bold uppercase tracking-widest">Kola Bro Premium Access</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <a id="pdfDownloadLink" href="#" target="_blank" class="bg-[#00ff88] hover:scale-105 text-black px-6 py-2.5 rounded-full text-xs font-black flex items-center gap-2 transition-all shadow-[0_0_20px_rgba(0,255,136,0.3)]">
                <i class="fa-solid fa-download"></i> DOWNLOAD PDF
            </a>
            <div class="h-8 w-px bg-white/2
